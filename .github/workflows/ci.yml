name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore src/backend/LinkShortener.sln
      # whitespace/style only, not the third "analyzers" category dotnet format also offers - this
      # gate is meant to catch drift in what .editorconfig actually encodes (indentation, EOL,
      # using order, file-scoped namespaces), not to also enforce every pre-existing CA/Sonar
      # analyzer warning as a build-breaking rule.
      - run: dotnet format whitespace src/backend/LinkShortener.sln --no-restore --verify-no-changes
      - run: dotnet format style src/backend/LinkShortener.sln --no-restore --verify-no-changes
      - run: dotnet build src/backend/LinkShortener.sln --no-restore --configuration Release
      - run: dotnet test src/backend/LinkShortener.sln --no-build --configuration Release

  control-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet format whitespace sandbox/infra/control-api/ControlApi.csproj --verify-no-changes
      - run: dotnet format style sandbox/infra/control-api/ControlApi.csproj --verify-no-changes
      - run: dotnet format whitespace sandbox/infra/tests/ControlApi.Tests/ControlApi.Tests.csproj --verify-no-changes
      - run: dotnet format style sandbox/infra/tests/ControlApi.Tests/ControlApi.Tests.csproj --verify-no-changes
      - run: dotnet build sandbox/infra/control-api/ControlApi.csproj --configuration Release
      - run: dotnet test sandbox/infra/tests/ControlApi.Tests/ControlApi.Tests.csproj --configuration Release

  frontend-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  frontend-architecture-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox/frontend/architecture-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sandbox/frontend/architecture-map/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f sandbox/docker-compose.yml build
      # e2e needs exactly these 5 images (its own trimmed docker-compose.e2e.yml references them by
      # tag via Testcontainers) - saved here and loaded there instead of e2e rebuilding them a
      # second time with no cache shared across jobs (GitHub-hosted runners don't share a Docker
      # daemon between jobs, so a plain `needs:` alone wouldn't avoid the rebuild).
      - run: docker save -o /tmp/e2e-images.tar sandbox-auth-api sandbox-link-api sandbox-redirect-api sandbox-shortener-service sandbox-traffic-service
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-images
          path: /tmp/e2e-images.tar
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v8
        with:
          name: e2e-images
          path: /tmp
      # E2E.Tests drives its own trimmed docker-compose.e2e.yml via Testcontainers, referencing
      # these 5 images by tag rather than building them itself - loaded from docker-build's own
      # output (same tags: compose's default <project>-<service> naming from sandbox/, matching
      # docker-compose.e2e.yml's ${..._IMAGE:-sandbox-...} fallback tags) instead of rebuilt here.
      - run: docker load -i /tmp/e2e-images.tar
      - run: dotnet test src/backend/tests/E2E.Tests/E2E.Tests.csproj --configuration Release

  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
