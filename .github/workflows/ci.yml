name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore src/backend/LinkShortener.sln
      - run: dotnet build src/backend/LinkShortener.sln --no-restore --configuration Release
      - run: dotnet test src/backend/LinkShortener.sln --no-build --configuration Release

  control-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build sandbox/infra/control-api/ControlApi.csproj --configuration Release
      - run: dotnet test sandbox/infra/tests/ControlApi.Tests/ControlApi.Tests.csproj --configuration Release

  frontend-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  frontend-architecture-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox/frontend/architecture-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sandbox/frontend/architecture-map/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f sandbox/docker-compose.yml build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # E2E.Tests drives its own trimmed docker-compose.e2e.yml via Testcontainers, referencing
      # these 5 images by tag rather than rebuilding them itself - see that project's own comment.
      - run: docker compose -f sandbox/docker-compose.yml build auth-api link-api redirect-api shortener-service traffic-service
      - run: dotnet test src/backend/tests/E2E.Tests/E2E.Tests.csproj --configuration Release

  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
