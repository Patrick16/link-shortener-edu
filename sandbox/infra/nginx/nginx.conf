worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS (127.0.0.11) returns one A record per replica of a compose service.
    # A static `upstream {}` block resolves once at startup/reload and never sees new/removed
    # replicas. Using `resolver` + a variable in `proxy_pass` instead makes nginx re-resolve the
    # service name on this schedule and round-robin across whatever it gets back each time - no
    # config regeneration or reload needed when the replica count changes via `docker compose
    # --scale`.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8082;

        location / {
            set $link_api http://link-api:8080;
            proxy_pass $link_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8083;

        location / {
            set $redirect_api http://redirect-api:8080;
            proxy_pass $redirect_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
