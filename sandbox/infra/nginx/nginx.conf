worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS (127.0.0.11) returns one A record per replica of a compose service.
    # Confirmed against the actual pulled image (nginx/1.31.6) that the `resolve` parameter on a
    # `server` directive is supported in open-source nginx here (it was Plus-only in much older
    # releases) - it re-resolves the hostname on this schedule and, when DNS returns several
    # addresses for one name, load-balances across all of them. That gives the same "pick up new/
    # removed replicas after `docker compose --scale` with no reload" property the old
    # resolver+variable `proxy_pass` pattern had, but from inside a real `upstream {}` block - which
    # is what makes `keepalive` (pooled, reused connections to link-api/redirect-api instead of one
    # new TCP connection per request) possible at all; keepalive only exists on upstream blocks, not
    # on a per-request variable proxy_pass.
    resolver 127.0.0.11 valid=5s;

    # buffer+flush batches access-log writes instead of a syscall per request - cheap insurance at
    # high RPS, not needed at this stack's normal educational load.
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

    # ReportingApi's upstream (below) also carries SignalR's long-lived WebSocket hub connections,
    # unlike link_api_upstream/redirect_api_upstream (plain request/response HTTP, Connection: ""
    # to enable upstream keepalive reuse instead). $http_upgrade is only non-empty on a real
    # WebSocket upgrade request, so this map lets the SAME location block below correctly pass
    # through "Connection: upgrade" for the hub path while still proxying ReportingApi's plain
    # REST endpoints (GET /reports/...) as ordinary HTTP - without it, nginx would either reject
    # the upgrade handshake outright or silently proxy it as a non-upgraded request, and SignalR
    # would fall back to a worse transport (or fail to connect at all) with no obvious error.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Runtime re-resolution (the `resolve` parameter below) requires the peer list to live in a
    # shared memory zone, since worker processes need to see the same, possibly-changing set of
    # backend IPs - without `zone`, nginx refuses to start ("resolving names at run time requires
    # upstream ... to be in shared memory"). 64k is far more than 2 peers need; it's sized for
    # headroom, not tuned down, since the cost of over-allocating a shared zone here is negligible.
    # max_fails/fail_timeout - passive health check, deferred follow-up from the graceful-shutdown
    # item (see .notes/PLAN.md, Resilience & Scale-Out Backlog #5). Without this, a draining
    # link-api/redirect-api replica only stops receiving new requests once `resolve valid=5s` above
    # re-resolves DNS and the IP genuinely disappears from Docker's embedded DNS - which doesn't
    # happen until the container actually exits, i.e. after `stop_grace_period`/`ShutdownTimeout`
    # have already finished draining it. Passive checks react to a REAL failed proxy attempt
    # (connection refused once the replica's listener closes, or a timeout) - `error timeout` is
    # nginx's own unconfigured default for `proxy_next_upstream`, already in effect below, so no
    # extra directive is needed to make a failure here actually retry the other peer. 2
    # consecutive failures within a 5s window (matching the existing `resolve valid=5s` cadence,
    # not picked independently) marks that resolved peer down for 5s - fast enough to matter during
    # a graceful shutdown's drain window, not so twitchy that one blip (e.g. the brief window right
    # as a replica starts, before its listener is up) takes it out of rotation for long.
    upstream link_api_upstream {
        zone link_api_zone 64k;
        server link-api:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    upstream redirect_api_upstream {
        zone redirect_api_zone 64k;
        server redirect-api:8080 resolve max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    # hash $remote_addr consistent - unlike link_api_upstream/redirect_api_upstream above, this
    # upstream also carries SignalR's hub connections, which negotiate over TWO separate HTTP
    # requests before the real transport ever opens (a POST /negotiate that allocates a
    # connectionId server-side, THEN the actual WebSocket/SSE/long-polling request using that id) -
    # found live, not assumed: without sticky-by-client routing, round-robin sent those two
    # requests to two DIFFERENT replicas and every connection failed ("No Connection with that ID:
    # 404"), exactly the failure SignalR's own client-side error message names ("check that sticky
    # sessions are enabled"). `consistent` (ketama hashing), not plain `ip_hash` - plain ip_hash
    # recomputes hash(ip) mod N over the CURRENT peer count, so a `docker compose --scale
    # reporting-api=N` change (exactly what this item wires into the control-plane UI) remaps most
    # existing clients' NEXT new connection to a different backend than their prior ones, transiently
    # reintroducing this same split-negotiate failure right as the stack scales (found in review);
    # consistent hashing only remaps ~1/N of clients on a peer-count change instead of nearly all of
    # them. Plain round-robin keepalive pooling (the other two upstreams' approach) never faced any
    # of this because neither carries a protocol with server-side per-client state split across
    # multiple requests.
    upstream reporting_api_upstream {
        zone reporting_api_zone 64k;
        hash $remote_addr consistent;
        server reporting-api:8080 resolve;
        keepalive 64;
    }

    server {
        listen 8082;

        location / {
            proxy_pass http://link_api_upstream;
            # Required for upstream keepalive to actually reuse connections - without these, nginx
            # talks HTTP/1.0 to the upstream and closes the connection after every response.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8083;

        location / {
            proxy_pass http://redirect_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8088;

        # SignalR's hub path only - carved out from the catch-all location below (not applied
        # uniformly) so plain REST requests keep reusing pooled upstream connections exactly like
        # link_api_upstream/redirect_api_upstream do. $connection_upgrade (see the map above) sends
        # "Connection: close" for every non-upgrade request it touches - fine for a WebSocket
        # handshake (which is a single long-lived connection anyway, never pooled), but it would
        # silently make `keepalive 64;` above dead configuration for ReportingApi's REST traffic if
        # applied to the catch-all location too (found in review).
        location /hub/top-links {
            proxy_pass http://reporting_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://reporting_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Messaging-mode=grpc internal fan-out. gRPC rides HTTP/2's single long-lived connection, so a
    # client (LinkApi/RedirectApi's SyncGrpcDispatcher) that resolved a hostname once and kept the
    # connection would pin to exactly one replica of shortener-service/traffic-service forever -
    # Docker's DNS only round-robins on a *new* connection, unlike HTTP/1.1 where nginx balances
    # per-request. Reusing nginx here (same `resolve` + shared-memory-zone pattern already proven
    # for link_api_upstream/redirect_api_upstream above) means scaling an internal service's
    # replica count stays transport-agnostic - the gRPC client always targets one stable nginx
    # address, nginx fans out across however many replicas currently exist. Not published to the
    # host (internal-only, same spirit as every worker's own unpublished 8090 gRPC port) - reach
    # these via `docker exec` into another container on this network if debugging directly.
    upstream shortener_service_grpc {
        zone shortener_service_grpc_zone 64k;
        server shortener-service:8090 resolve;
        keepalive 64;
    }

    upstream traffic_service_grpc {
        zone traffic_service_grpc_zone 64k;
        server traffic-service:8090 resolve;
        keepalive 64;
    }

    # No reporting_service_grpc upstream/9092 server block - ReportingService doesn't host a
    # messaging-mode gRPC endpoint (RedirectApi's SyncGrpcDispatcher targets TrafficService only);
    # an earlier version provisioned one anyway "for symmetry" with no caller, removed during
    # review as dead infrastructure (found during review).

    server {
        listen 9090;
        http2 on;

        location / {
            grpc_pass grpc://shortener_service_grpc;
            # Explicitly labeled retry shim, not a substitute for the bus's durable SQLite fallback
            # queue (see SyncGrpcDispatcher's own comment) - only helps when one replica is down and
            # another is healthy; if every replica is down, or the server crashes mid-call after
            # accepting it, nothing here persists the message anywhere. That contrast - proxy-level
            # retry vs. a real persistent retry queue - is itself one of this feature's lessons.
            grpc_next_upstream error timeout;
        }
    }

    server {
        listen 9091;
        http2 on;

        location / {
            grpc_pass grpc://traffic_service_grpc;
            grpc_next_upstream error timeout;
        }
    }
}
