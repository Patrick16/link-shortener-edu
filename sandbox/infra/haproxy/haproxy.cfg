# TCP load balancer in front of pgcat's 3 replicas (one `pgcat` service, `deploy.replicas: 3` in
# docker-compose.yml - see that service's own comment for why it's 1 scaled service, not 3
# separately-named ones) - the Pooler Scaling feature's whole point. Every DB-touching service
# connects to haproxy:6432, never to pgcat directly (see InfraToggleService's DB_HOST toggle).

global
    log stdout format raw local0
    # Lets `haproxy -c -f this-file` (the Docker healthcheck, see docker-compose.yml) validate the
    # config without a live log target - without this, config validation itself can fail trying to
    # resolve "stdout" outside a running container's log pipeline.
    log-send-hostname

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Docker's embedded DNS (127.0.0.11) resolves the `pgcat` hostname at runtime, repeatedly, instead
# of once at config load - a scaled Compose service only registers the one service-level DNS name
# (confirmed live: `pgcat-1`/`pgcat-2` individually do NOT resolve at all once `pgcat` is a
# 3-replica service rather than 3 separately-named services - only `getent hosts pgcat` resolves,
# returning all 3 replicas' IPs as separate A records). Same problem and same fix nginx.conf
# already needed for its own replica upstreams (its `resolve` keyword) - see that file's comment
# for the fuller story.
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

# Every DB-touching service's actual Postgres traffic - mode tcp, since pgcat itself speaks the
# Postgres wire protocol (HAProxy only needs to pick a backend and pass bytes through).
frontend pgcat_front
    bind *:6432
    default_backend pgcat_back

backend pgcat_back
    balance leastconn
    # Understands the Postgres wire protocol well enough to tell a pgcat instance that accepts TCP
    # connections but can't actually complete a startup handshake (wedged, out of file descriptors,
    # etc.) from one that's genuinely healthy - a bare TCP connect check can't tell the difference.
    # `user postgres` only needs to get as far as a server response to the startup packet, not a
    # full authenticated login.
    option pgsql-check user postgres
    # server-template, not 3 static `server` lines: `pgcat` is one Compose service scaled to 3
    # replicas (deploy.replicas, see docker-compose.yml), and its DNS name resolves to however many
    # A records the service currently has (confirmed live: 3) rather than 3 individually-addressable
    # hostnames. "6" reserves up to 6 backend slots (2x headroom over today's 3 replicas) that fill
    # in/empty out as DNS answers change - raise it if this stack ever scales pgcat further, but see
    # this service's own docker-compose.yml comment for why it isn't in control-api's generic scale
    # control today. init-addr none: don't require a resolvable address at config-parse time either
    # (belt and suspenders with the runtime resolvers below) - without it, HAProxy can refuse to
    # even start if it races ahead of Docker's DNS being ready for a freshly-created container
    # (confirmed live earlier in this feature's own history: "could not resolve address" on first
    # boot).
    server-template pgcat 6 pgcat:6432 check inter 3s fall 3 rise 2 resolvers docker_dns init-addr none

# Separate HTTP frontend for operator/observability surfaces - never touches Postgres traffic, so
# it's fine for this one frontend to run in http mode despite the file's tcp default above.
frontend observability
    mode http
    bind *:8405
    # Human-readable stats page - http://localhost:8405/stats (see docker-compose.yml's port
    # mapping). Useful for eyeballing live per-backend connection counts without Grafana open.
    stats enable
    stats uri /stats
    stats refresh 10s
    # HAProxy's own built-in Prometheus exporter (no sidecar container needed) - scraped by
    # sandbox/infra/prometheus/prometheus.yml's haproxy job.
    http-request use-service prometheus-exporter if { path /metrics }
