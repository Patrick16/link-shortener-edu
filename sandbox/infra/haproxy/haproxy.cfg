# TCP load balancer in front of the 3 pgcat instances (pgcat-1/2/3, see docker-compose.yml) - the
# Pooler Scaling feature's whole point. Every DB-touching service connects to haproxy:6432, never
# to a pgcat instance directly (see InfraToggleService's DB_HOST toggle).

global
    log stdout format raw local0
    # Lets `haproxy -c -f this-file` (the Docker healthcheck, see docker-compose.yml) validate the
    # config without a live log target - without this, config validation itself can fail trying to
    # resolve "stdout" outside a running container's log pipeline.
    log-send-hostname

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Docker's embedded DNS (127.0.0.11) resolves pgcat-1/2/3 at runtime instead of once at config
# load - without this, `server pgcat-1 pgcat-1:6432` resolves the hostname a single time at
# startup (HAProxy's default) and never again, so haproxy refuses to even start if it races
# ahead of Docker's DNS being ready for a freshly-created container (confirmed live: "could not
# resolve address" on first boot), and would keep routing to a stale IP forever after any pgcat
# container gets recreated. Same problem and same fix nginx.conf already needed for its own
# replica upstreams (its `resolve` keyword) - see that file's comment for the fuller story.
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 10s

# Every DB-touching service's actual Postgres traffic - mode tcp, since pgcat itself speaks the
# Postgres wire protocol (HAProxy only needs to pick a backend and pass bytes through).
frontend pgcat_front
    bind *:6432
    default_backend pgcat_back

backend pgcat_back
    balance leastconn
    # Understands the Postgres wire protocol well enough to tell a pgcat instance that accepts TCP
    # connections but can't actually complete a startup handshake (wedged, out of file descriptors,
    # etc.) from one that's genuinely healthy - a bare TCP connect check can't tell the difference.
    # `user postgres` only needs to get as far as a server response to the startup packet, not a
    # full authenticated login.
    option pgsql-check user postgres
    # init-addr none: don't require a resolvable address at config-parse time either (belt and
    # suspenders with the runtime resolvers above) - without it, the same race above can still
    # refuse to start even with `resolvers` configured, since init-addr's own default tries libc
    # resolution once, synchronously, before the resolvers section ever gets a chance to run.
    server pgcat-1 pgcat-1:6432 check inter 3s fall 3 rise 2 resolvers docker_dns init-addr none
    server pgcat-2 pgcat-2:6432 check inter 3s fall 3 rise 2 resolvers docker_dns init-addr none
    server pgcat-3 pgcat-3:6432 check inter 3s fall 3 rise 2 resolvers docker_dns init-addr none

# Separate HTTP frontend for operator/observability surfaces - never touches Postgres traffic, so
# it's fine for this one frontend to run in http mode despite the file's tcp default above.
frontend observability
    mode http
    bind *:8405
    # Human-readable stats page - http://localhost:8405/stats (see docker-compose.yml's port
    # mapping). Useful for eyeballing live per-backend connection counts without Grafana open.
    stats enable
    stats uri /stats
    stats refresh 10s
    # HAProxy's own built-in Prometheus exporter (no sidecar container needed) - scraped by
    # sandbox/infra/prometheus/prometheus.yml's haproxy job.
    http-request use-service prometheus-exporter if { path /metrics }
