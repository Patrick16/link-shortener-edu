#
# PgCat in front of Postgres — one primary + 2 streaming replicas (postgres-replica1/2), same trio
# for all three databases since replication is cluster-wide, not per-database (see
# infra/postgres/replica-entrypoint.sh).
#
# One pool per physical database (see infra/postgres/init-databases.sql for why they're separate
# databases, not schemas). Each pool has exactly one shard, with 3 servers: primary + 2 replicas.
# query_parser_enabled + query_parser_read_write_splitting + primary_reads_enabled means PgCat
# auto-routes: SELECT (no FOR UPDATE) load balances across all 3 servers, everything else
# (INSERT/UPDATE/DELETE, DDL, transactions) goes to the primary only — no app-side read/write split
# needed. query_parser_read_write_splitting is NOT optional/cosmetic here - query_parser_enabled
# alone does not infer read/write role from the query text (verified live: without it, a plain
# INSERT and a CREATE TABLE both landed on a replica and were rejected as read-only).
#
# Sharding links_db (shard1.toml/shard2.toml, currently TODO stubs) is scenario 4, not this file.

[general]
host = "0.0.0.0"
port = 6432
enable_prometheus_exporter = false
connect_timeout = 5000
idle_timeout = 30000
healthcheck_timeout = 1000
healthcheck_delay = 30000
shutdown_timeout = 5000
ban_time = 20
log_client_connections = false
log_client_disconnections = false
# Picks up connection-string/pool-size edits without a container restart while poking at this.
autoreload = 15000
worker_threads = 4
admin_username = "admin_user"
admin_password = "admin_pass"

[pools.users_db]
pool_mode = "transaction"
default_role = "primary"
query_parser_enabled = true
query_parser_read_write_splitting = true  # see the file header comment - load-bearing, not cosmetic
primary_reads_enabled = true

[pools.users_db.users.0]
username = "postgres"
password = "postgres"
pool_size = 10
statement_timeout = 0

[pools.users_db.shards.0]
servers = [["postgres", 5432, "primary"], ["postgres-replica1", 5432, "replica"], ["postgres-replica2", 5432, "replica"]]
database = "users_db"

[pools.links_db]
pool_mode = "transaction"
default_role = "primary"
query_parser_enabled = true
query_parser_read_write_splitting = true  # see the file header comment - load-bearing, not cosmetic
primary_reads_enabled = true

[pools.links_db.users.0]
username = "postgres"
password = "postgres"
# LinkApi + RedirectApi both read this pool and ShortenerService writes it - busiest of the three
# under load, hence the bigger pool.
pool_size = 20
statement_timeout = 0

[pools.links_db.shards.0]
servers = [["postgres", 5432, "primary"], ["postgres-replica1", 5432, "replica"], ["postgres-replica2", 5432, "replica"]]
database = "links_db"

[pools.clicks_db]
pool_mode = "transaction"
default_role = "primary"
query_parser_enabled = true
query_parser_read_write_splitting = true  # see the file header comment - load-bearing, not cosmetic
primary_reads_enabled = true

[pools.clicks_db.users.0]
username = "postgres"
password = "postgres"
pool_size = 10
statement_timeout = 0

[pools.clicks_db.shards.0]
servers = [["postgres", 5432, "primary"], ["postgres-replica1", 5432, "replica"], ["postgres-replica2", 5432, "replica"]]
database = "clicks_db"
