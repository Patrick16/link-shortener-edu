# Template for redis-sentinel-1/2/3 — copied into a writable named volume on first start (see
# docker-compose.yml) because Sentinel rewrites its own config file on every state change
# (failover, new replica discovered), which a read-only bind mount from the repo can't support.
#
# IP-based monitoring, not resolve-hostnames/announce-hostnames — tried hostname-based first (nicer
# in theory: survives a container getting a new IP on recreate) but it broke the actual failover
# this whole setup exists for. Verified live by killing redis-master: once the container is gone,
# Docker's embedded DNS stops resolving "redis-master" at all, and Sentinel's repeated blocking
# resolution attempts stalled its own cron loop badly enough to keep re-triggering Sentinel's
# self-protective "tilt mode" (a safety mode that refuses to fail over) every cycle, forever — it
# never got the 30 clean seconds tilt mode requires before exiting, so no failover ever happened.
# IP-based monitoring hits a clean, fast "connection refused" instead of a blocking DNS timeout, so
# the down-detection/failover cycle actually completes. The line below still names "redis-master" —
# that hostname is only resolved once, at Sentinel's own startup, to seed the initial IP.
port 26379
dir /tmp

sentinel monitor mymaster redis-master 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
