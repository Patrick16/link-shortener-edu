# App-level metrics (top job) come via otel-collector's own `prometheus` exporter (see
# otel-collector-config.full.yaml) - the collector receives them over OTLP from every backend
# service and exposes them here for Prometheus to pull, rather than each service being scraped
# individually. Infra-level metrics (the jobs below) come from one exporter per HA-cluster node
# (see docker-compose.yml's postgres-exporter-*/redis-exporter-*/mongo-exporter-* services and
# rabbitmq's own bundled rabbitmq_prometheus plugin) - labeled by role/member so a dashboard can
# tell the nodes apart (who's currently primary/master, replication lag per node, etc). pgcat is the
# one exception to "one exporter per node" - it exposes its own built-in Prometheus endpoint
# directly (no separate exporter container), enabled in PgcatService.RenderPgcatToml/
# pgcat.toml.example.
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: otel-collector
    scrape_interval: 5s
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: pgcat
    scrape_interval: 5s
    static_configs:
      - targets: ["pgcat:9930"]

  - job_name: postgres
    scrape_interval: 5s
    static_configs:
      - targets: ["postgres-exporter-primary:9187"]
        labels: { role: primary }
      - targets: ["postgres-exporter-replica1:9187"]
        labels: { role: replica1 }
      - targets: ["postgres-exporter-replica2:9187"]
        labels: { role: replica2 }

  - job_name: redis
    scrape_interval: 5s
    static_configs:
      - targets: ["redis-exporter-master:9121"]
        labels: { role: master }
      - targets: ["redis-exporter-replica1:9121"]
        labels: { role: replica1 }
      - targets: ["redis-exporter-replica2:9121"]
        labels: { role: replica2 }

  - job_name: mongodb
    scrape_interval: 5s
    static_configs:
      - targets: ["mongo-exporter-1:9216"]
        labels: { member: mongo1 }
      - targets: ["mongo-exporter-2:9216"]
        labels: { member: mongo2 }
      - targets: ["mongo-exporter-3:9216"]
        labels: { member: mongo3 }

  - job_name: rabbitmq
    scrape_interval: 5s
    # The default /metrics path only exposes rabbitmq_queue_messages as one cluster-wide,
    # unlabeled aggregate across every queue/vhost - confirmed live against a real broker before
    # relying on it. Per-queue data (what RabbitMqQueueBacklog's {{ $labels.queue }} actually
    # needs) only exists on /metrics/detailed with family=queue_coarse_metrics, which is where
    # rabbitmq_detailed_queue_messages{vhost, queue} comes from instead.
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics"]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-aggregate
    scrape_interval: 5s
    # The cluster-wide counters this job's own dashboard panels need (connections, channels,
    # consumers, queue count, process memory) only live on the plain /metrics path - confirmed
    # live, same as the job above's own comment. A separate job (not a second params= on the same
    # job_name - Prometheus doesn't support that) rather than switching the job above to this path,
    # since /metrics/detailed is still the only place the per-queue depth labels exist.
    static_configs:
      - targets: ["rabbitmq:15692"]
