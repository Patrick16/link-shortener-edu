# Shared dev-only JWT signing key — AuthApi issues tokens with it, LinkApi validates them with the
# same key. A single anchor means the two can't accidentally drift onto different values.
x-jwt-signing-key: &jwt-signing-key "dev-only-signing-key-do-not-use-in-production-1234567890"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # No POSTGRES_DB — the init script below creates the actual databases (one per owning
      # service, not schemas-in-one-database; see infra/postgres/init-databases.sql for why).
    # wal_level=replica + max_wal_senders/max_replication_slots are what let postgres-replica1/2
    # stream from this instance at all (off by default); hot_standby is a no-op on a primary but
    # harmless to set uniformly. max_connections is set explicitly (not left at the image default)
    # because a standby's own max_connections must be >= the primary's or it refuses to start hot
    # standby at all - postgres-replica1/2 read the *same* POSTGRES_MAX_CONNECTIONS value (see
    # replica-entrypoint.sh) specifically so the two can never drift apart.
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - ./infra/postgres/init-replication-hba.sh:/docker-entrypoint-initdb.d/init-replication-hba.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Streaming (physical) replicas of the whole cluster — replication in Postgres is cluster-wide,
  # not per-database, so one primary + these two replicas cover users_db/links_db/clicks_db
  # together. See replica-entrypoint.sh for how each one bootstraps itself via pg_basebackup on
  # first start, then runs as a normal hot-standby thereafter.
  postgres-replica1:
    image: postgres:16-alpine
    user: postgres
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_pass
      # Same value the primary gets (see its own command: block) - a standby with a lower
      # max_connections than its primary refuses to start hot standby at all.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
    ports:
      - "5433:5432" # exposed for local inspection - confirm it's actually a standby via `psql ... -c "SELECT pg_is_in_recovery()"`
    volumes:
      - postgres-replica1-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica2:
    image: postgres:16-alpine
    user: postgres
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_pass
      # Same value the primary gets (see its own command: block) - a standby with a lower
      # max_connections than its primary refuses to start hot standby at all.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
    ports:
      - "5434:5432"
    volumes:
      - postgres-replica2-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgcat:
    image: ghcr.io/postgresml/pgcat:latest
    ports:
      - "6432:6432" # exposed for local psql/inspection, same as postgres's own 5432 below
    volumes:
      - ./infra/pgcat/pgcat.toml:/etc/pgcat/pgcat.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica1:
        condition: service_healthy
      postgres-replica2:
        condition: service_healthy
    healthcheck:
      # pg_isready alone doesn't complete password auth, so pgcat logs a (harmless) warning per
      # check - a real authenticated query against one of the actual pools both avoids the log
      # noise and proves pooling itself works, not just that the port accepts TCP connections.
      test: ["CMD-SHELL", "PGPASSWORD=postgres psql -h 127.0.0.1 -p 6432 -U postgres -d links_db -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis HA trio: one master, two replicas, three Sentinels watching them (quorum 2/3 — see
  # infra/redis/sentinel.conf). link-api/redirect-api connect through the Sentinels, not the master
  # directly (StackExchange.Redis's `serviceName=` connection-string form talks to the Sentinels
  # first to discover the current master and auto-reconnects on failover — no app code needed for
  # this, see Shared/Infrastructure/RedisClickCounterService.cs and Shared/Common/EntityCacheService.cs).
  redis-master:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/master-entrypoint.sh:/master-entrypoint.sh:ro
    # Checks with Sentinel before deciding to start as a master - see master-entrypoint.sh for why a
    # bare `redis-server` here would produce a split brain on rejoin after a real failover.
    entrypoint: ["/bin/sh", "/master-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-replica1:
    image: redis:7-alpine
    # --min-replicas-* baked in here too, not just master-entrypoint.sh's redis-master paths -
    # Sentinel promotes a replica to master via REPLICAOF NO ONE without setting server-level config,
    # so whichever node ends up master (this one included) needs to have started with it already.
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "10"]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-replica2:
    image: redis:7-alpine
    # See redis-replica1's comment on --min-replicas-*.
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "10"]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-1:
    image: redis:7-alpine
    # Sentinel rewrites its own config file on every state change, so the template gets copied into
    # a writable named volume rather than bind-mounted read-only from the repo.
    entrypoint: ["/bin/sh", "-c"]
    # Without `sentinel resolve-hostnames` (see infra/redis/sentinel.conf for why), a hostname in
    # the "sentinel monitor" line still has to resolve once at Sentinel's own startup to seed the
    # initial IP - but verified live that Sentinel's own internal resolver fails on this hostname
    # even when `getent`/`redis-cli -h` (this same image, same network) resolve it fine, treating
    # the failure as FATAL (crash-loops, no retry) rather than transient - looks like a musl/Alpine
    # resolver quirk in the Sentinel binary itself, not an actual DNS problem. Worked around by
    # resolving the IP ourselves with `getent` (known-working) and baking the literal IP into the
    # generated config, so Sentinel's own resolver is never involved at all.
    # The config is regenerated from the template on EVERY start, not just the first: a literal IP
    # baked in on one `docker compose up` goes stale the moment redis-master's container gets
    # recreated, because Docker hands out container IPs from the network's pool in creation order,
    # not by hostname - a later `up`/`down` cycle can easily reassign that same IP to a different
    # container (verified live: a stale sentinel.conf here ended up pointing "mymaster" at what had
    # become redis-replica1's IP, and StackExchange.Redis's Sentinel client rejected it once it saw
    # `role:slave` in INFO, throwing "Failed connecting to configured primary" on every request). The
    # sed is also anchored to the `sentinel monitor` line specifically (not a bare `s/redis-master/`)
    # so it substitutes the IP into the directive without also mangling this comment's own prose.
    # Regenerating on every start does discard any state Sentinel had rewritten into this file since
    # container start (known-replicas, epoch, a mid-flight promotion) - acceptable here since that
    # state is only useful across a Sentinel container's own restart, and Sentinel rediscovers it
    # within a few cron cycles of reconnecting to whichever container "redis-master" resolves to.
    command: ["until getent hosts redis-master >/dev/null 2>&1; do echo 'waiting for redis-master DNS...'; sleep 1; done; MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}' | head -1); sed \"s/^sentinel monitor mymaster redis-master/sentinel monitor mymaster $$MASTER_IP/\" /etc/redis-template/sentinel.conf > /etc/redis/sentinel.conf; exec redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis-template/sentinel.conf:ro
      - redis-sentinel-1-data:/etc/redis
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_healthy
      redis-replica2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-2:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    # See the matching comment on redis-sentinel-1 for why this resolves "redis-master" itself
    # (Sentinel's own internal resolver faults on it) and why the config is regenerated fresh from
    # the template on every start rather than only the first (a baked-in IP goes stale the moment
    # container recreation reassigns it to a different container).
    command: ["until getent hosts redis-master >/dev/null 2>&1; do echo 'waiting for redis-master DNS...'; sleep 1; done; MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}' | head -1); sed \"s/^sentinel monitor mymaster redis-master/sentinel monitor mymaster $$MASTER_IP/\" /etc/redis-template/sentinel.conf > /etc/redis/sentinel.conf; exec redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis-template/sentinel.conf:ro
      - redis-sentinel-2-data:/etc/redis
    ports:
      - "26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_healthy
      redis-replica2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-3:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    # See the matching comment on redis-sentinel-1 for why this resolves "redis-master" itself
    # (Sentinel's own internal resolver faults on it) and why the config is regenerated fresh from
    # the template on every start rather than only the first (a baked-in IP goes stale the moment
    # container recreation reassigns it to a different container).
    command: ["until getent hosts redis-master >/dev/null 2>&1; do echo 'waiting for redis-master DNS...'; sleep 1; done; MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}' | head -1); sed \"s/^sentinel monitor mymaster redis-master/sentinel monitor mymaster $$MASTER_IP/\" /etc/redis-template/sentinel.conf > /etc/redis/sentinel.conf; exec redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis-template/sentinel.conf:ro
      - redis-sentinel-3-data:/etc/redis
    ports:
      - "26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_healthy
      redis-replica2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      # "ping" only checks the Erlang node is alive — it can succeed before the AMQP listener
      # itself is actually bound, which raced clients that connect the moment it goes "healthy".
      # check_port_connectivity verifies the configured ports (5672 included) are open.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3-node replica set (mongo1/2/3), no auth (keyless replset — matches the rest of this stack's
  # no-auth dev posture). mongo-init below runs rs.initiate() once; the members themselves just
  # need --replSet so they know what set they belong to.
  mongo1:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017" # exposed for local inspection (mongosh / Compass), same spirit as postgres's 5432
    volumes:
      - mongo1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo3:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: initiates rs0 once all 3 members are up, then exits 0. Idempotent across restarts —
  # rs.status() succeeds (and it just logs "already initialized") once the set exists, so a
  # `docker compose up` that recreates this container harmlessly no-ops instead of erroring.
  mongo-init:
    image: mongo:7
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mongosh --host mongo1:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initialized");
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "mongo1:27017" },
                { _id: 1, host: "mongo2:27017" },
                { _id: 2, host: "mongo3:27017" }
              ]
            });
            print("replica set initiated");
          }
        '
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8085:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
      # Dev-only, same spirit as the aspire-dashboard anonymous-access flag below - skips the
      # basic-auth prompt so this behaves like RedisInsight (open the URL, no login).
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    # No database is pre-registered — on first open, add one with host "redis-master", port 6379
    # (RedisInsight itself isn't Sentinel-aware; it's a dev GUI, not the app, so pointing it at the
    # current master directly is fine — re-add if a failover actually promotes a different node).

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888" # dashboard UI
      - "18889:18889" # OTLP gRPC endpoint — services send logs/metrics/traces here
    environment:
      # Dev-only: disables the dashboard's own login and OTLP API-key check. Never do this outside
      # a local learning setup.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  auth-api:
    build:
      context: ..
      dockerfile: src/backend/Services/AuthApi/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # DB_HOST/DB_PORT default to pgcat - control-api's pgcat toggle re-runs `docker compose up`
      # with these overridden to postgres:5432, recreating this service so it demonstrates running
      # without connection pooling instead of just leaving pgcat unused. Maximum Pool Size (Npgsql's
      # own client-side pool, distinct from pgcat's server-side pool) is 100 by default - the
      # experimental control lets it be shrunk to demonstrate Npgsql's own pool-wait saturation
      # independent of pgcat's, see SetNpgsqlPoolSizeAsync.
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=users_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # EF migrations (DDL) go straight to the primary, bypassing PgCat entirely - see
      # Constants.PostgresPrimaryConnectionString for why.
      ConnectionStrings__PostgresPrimary: "Host=postgres;Port=5432;Database=users_db;Username=postgres;Password=postgres"
      Jwt__SigningKey: *jwt-signing-key
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      pgcat:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  link-api:
    build:
      context: ..
      dockerfile: src/backend/Services/LinkApi/Dockerfile
    # No host port mapping - multiple replicas (docker compose up --scale link-api=N) can't all
    # bind the same host port. nginx is the external entry point on 8082 instead (see below).
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=links_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # Sentinel-aware form (StackExchange.Redis native support): endpoints are the 3 Sentinels, not
      # the master directly - the client asks them who's master, connects there, and gets told about
      # any failover automatically. No code change needed for this vs. a plain host:port string.
      ConnectionStrings__Redis: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379,serviceName=mymaster"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      Jwt__SigningKey: *jwt-signing-key
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      # Defaults to true - control-api's cache toggle recreates link-api/redirect-api with this set
      # to false so the app skips Redis entirely (see EntityCacheService), a clean "no caching"
      # demo rather than every request eating a failed-connection timeout against a stopped redis.
      Cache__Enabled: "${CACHE_ENABLED:-true}"
    depends_on:
      pgcat:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redirect-api:
    build:
      context: ..
      dockerfile: src/backend/Services/RedirectApi/Dockerfile
    # No host port mapping - see the note on link-api above; nginx exposes this on 8083 instead.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=links_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      ConnectionStrings__Redis: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379,serviceName=mymaster"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      Cache__Enabled: "${CACHE_ENABLED:-true}"
    depends_on:
      pgcat:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "8082:8082" # LinkApi - round-robins across however many link-api replicas exist
      - "8083:8083" # RedirectApi - same, for redirect-api
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      link-api:
        condition: service_healthy
      redirect-api:
        condition: service_healthy

  shortener-service:
    build:
      context: ..
      dockerfile: src/backend/Services/ShortenerService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=links_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # EF migrations (DDL) go straight to the primary, bypassing PgCat entirely - see
      # Constants.PostgresPrimaryConnectionString for why.
      ConnectionStrings__PostgresPrimary: "Host=postgres;Port=5432;Database=links_db;Username=postgres;Password=postgres"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # Consumer QoS (unacked deliveries in flight) - read once at consumer startup, so changing it
      # needs a recreate, not a live toggle. See RabbitMqConsumer's own _prefetchCount field.
      RabbitMq__PrefetchCount: "${RABBITMQ_PREFETCH:-10}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      pgcat:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  traffic-service:
    build:
      context: ..
      dockerfile: src/backend/Services/TrafficService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=clicks_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # EF migrations (DDL) go straight to the primary, bypassing PgCat entirely - see
      # Constants.PostgresPrimaryConnectionString for why.
      ConnectionStrings__PostgresPrimary: "Host=postgres;Port=5432;Database=clicks_db;Username=postgres;Password=postgres"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # Replica-set-aware URI - the Mongo driver discovers the current primary from these 3 seeds
      # and auto-reconnects on failover; MongoClickMetaStore already just takes whatever connection
      # string it's given (database name comes from the URL path), no code change needed.
      # readPreference is the only part of this driven by the experimental control - see
      # SetMongoReadPreferenceAsync. MongoClickMetaStore itself needs no code change; it already
      # just takes whatever connection string it's given.
      ConnectionStrings__Mongo: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/clicks_meta_db?replicaSet=rs0&readPreference=${MONGO_READ_PREFERENCE:-primary}"
      RabbitMq__PrefetchCount: "${RABBITMQ_PREFETCH:-10}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      pgcat:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      aspire-dashboard:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-api:
    build:
      context: ./infra/control-api
      dockerfile: Dockerfile
    ports:
      - "5299:8080"
    environment:
      Docker__Endpoint: "unix:///var/run/docker.sock"
      Docker__ComposeProject: "sandbox"
      Docker__ComposeFile: "/workspace/docker-compose.yml"
      Pgcat__ConfigDir: "/pgcat-config"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5174"
      Scenarios__DataDir: "/data"
    volumes:
      # Lets this container talk to the Docker Engine managing the whole stack, so it can
      # stop/start/restart sibling containers on request. Local-stack-only tool - never point this
      # at a shared/real host; see sandbox/docs/architecture.md for why this is safe here.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: needed so the `docker compose` CLI inside this container (see its Dockerfile)
      # can find docker-compose.yml to run `--scale`. Compose itself does the actual work against
      # the Docker Engine via the socket above; this mount is just so it can read its own file.
      - ./:/workspace:ro
      # Separate, writable mount of the same host directory the pgcat service reads its config from
      # (read-only, below) - lets control-api rewrite pgcat.toml directly for the pool-settings
      # control without touching the read-only /workspace mount above. pgcat's own `autoreload`
      # picks up the change on its own; see DockerService.SetPgcatPoolSettingsAsync.
      - ./infra/pgcat:/pgcat-config
      # Saved custom traffic scenarios (endpoints + load ramp) - a real volume, not the read-only
      # workspace mount above, so they survive a control-api rebuild the same way postgres-data
      # survives one.
      - control-api-data:/data

volumes:
  postgres-data:
  postgres-replica1-data:
  postgres-replica2-data:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
  redisinsight-data:
  control-api-data:
