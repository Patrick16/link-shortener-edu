# Shared dev-only JWT signing key — AuthApi issues tokens with it, LinkApi validates them with the
# same key. A single anchor means the two can't accidentally drift onto different values.
x-jwt-signing-key: &jwt-signing-key "dev-only-signing-key-do-not-use-in-production-1234567890"

# Shared dev-only secret for LinkApi's InternalApiKey authentication scheme — control-api sends it
# to get unscoped ("root") access to GET /Links for the traffic data-pool preload, since that call
# needs a broad sample across every user's links, not one arbitrary user's own (which is all a
# per-user JWT could ever grant). Never exposed to the frontend/end users - see
# InternalApiKeyAuthenticationHandler.
x-internal-api-key: &internal-api-key "dev-only-internal-api-key-do-not-use-in-production-1234567890"

# Caps every container's default json-file log driver so a long-running stack (or a k6 load test
# hammering LinkApi/RedirectApi for minutes) can't quietly fill the host's disk with log files - the
# driver still rotates and keeps the most recent output, it just stops growing without bound. Doesn't
# affect the Aspire Dashboard log viewer or otel-collector - those get logs over OTLP independently of
# what Docker itself retains on disk (see ServiceDefaults.Extensions.ConfigureLogging).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # No POSTGRES_DB — the init script below creates the actual databases (one per owning
      # service, not schemas-in-one-database; see infra/postgres/init-databases.sql for why).
    # wal_level=replica + max_wal_senders/max_replication_slots are what let postgres-replica1/2
    # stream from this instance at all (off by default); hot_standby is a no-op on a primary but
    # harmless to set uniformly. max_connections is set explicitly (not left at the image default)
    # because a standby's own max_connections must be >= the primary's or it refuses to start hot
    # standby at all - postgres-replica1/2 read the *same* POSTGRES_MAX_CONNECTIONS value (see
    # replica-entrypoint.sh) specifically so the two can never drift apart. Raised from 100 to 200:
    # pgcat's pool_size=40 x 3 database pools (users_db/links_db/clicks_db) can each open up to 40
    # connections to *this* primary, so worst case is 120 just from pgcat - 100 left no headroom at
    # all for pgweb/exporters/admin psql. See sandbox/docs/pgcat-pool-sizing.md.
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - ./infra/postgres/init-replication-hba.sh:/docker-entrypoint-initdb.d/init-replication-hba.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Streaming (physical) replicas of the whole cluster — replication in Postgres is cluster-wide,
  # not per-database, so one primary + these two replicas cover users_db/links_db/clicks_db
  # together. See replica-entrypoint.sh for how each one bootstraps itself via pg_basebackup on
  # first start, then runs as a normal hot-standby thereafter.
  postgres-replica1:
    logging: *default-logging
    image: postgres:16-alpine
    user: postgres
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_pass
      # Same value the primary gets (see its own command: block) - a standby with a lower
      # max_connections than its primary refuses to start hot standby at all.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
      # Own, permanent replication slot (see replica-entrypoint.sh) - without one, the primary is
      # free to recycle WAL this replica hasn't consumed yet the moment it falls behind, so a
      # disconnected-long-enough replica can never resume streaming and needs a manual rebuild.
      REPLICA_SLOT_NAME: replica1_slot
    ports:
      - "5433:5432" # exposed for local inspection - confirm it's actually a standby via `psql ... -c "SELECT pg_is_in_recovery()"`
    volumes:
      - postgres-replica1-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    # pg_isready alone only proves the process accepts connections, not that streaming replication
    # is actually happening - a replica whose connection to the primary breaks (network blip, primary
    # restart, or a permanently-behind replica per replica-entrypoint.sh's own known limitation) keeps
    # answering pg_isready as healthy forever, so pgcat/downstream services never learn the replica
    # they're routing reads to has gone stale. pg_is_in_recovery() alone isn't enough either - a
    # standby stays "in recovery" even after its streaming connection dies, it just stops receiving
    # new WAL. pg_stat_wal_receiver has a row only while the walreceiver process is actively connected
    # to the primary, so combining both is what actually distinguishes "healthy standby" from "standby
    # whose replication silently died".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc 'SELECT pg_is_in_recovery() AND EXISTS (SELECT 1 FROM pg_stat_wal_receiver)' | grep -q '^t$'"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-replica2:
    logging: *default-logging
    image: postgres:16-alpine
    user: postgres
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_pass
      # Same value the primary gets (see its own command: block) - a standby with a lower
      # max_connections than its primary refuses to start hot standby at all.
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
      # See postgres-replica1's REPLICA_SLOT_NAME comment - own slot, must be a different name.
      REPLICA_SLOT_NAME: replica2_slot
    ports:
      - "5434:5432"
    volumes:
      - postgres-replica2-data:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    # See postgres-replica1's identical healthcheck for why pg_isready alone isn't enough here.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc 'SELECT pg_is_in_recovery() AND EXISTS (SELECT 1 FROM pg_stat_wal_receiver)' | grep -q '^t$'"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgcat:
    logging: *default-logging
    image: ghcr.io/postgresml/pgcat:latest
    ports:
      - "6432:6432" # exposed for local psql/inspection, same as postgres's own 5432 below
    volumes:
      - ./infra/pgcat/pgcat.toml:/etc/pgcat/pgcat.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica1:
        condition: service_healthy
      postgres-replica2:
        condition: service_healthy
    healthcheck:
      # pg_isready alone doesn't complete password auth, so pgcat logs a (harmless) warning per
      # check - a real authenticated query against one of the actual pools both avoids the log
      # noise and proves pooling itself works, not just that the port accepts TCP connections.
      test: ["CMD-SHELL", "PGPASSWORD=postgres psql -h 127.0.0.1 -p 6432 -U postgres -d links_db -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis HA trio: one master, two replicas, three Sentinels watching them (quorum 2/3 — see
  # infra/redis/sentinel.conf). link-api/redirect-api connect through the Sentinels, not the master
  # directly (StackExchange.Redis's `serviceName=` connection-string form talks to the Sentinels
  # first to discover the current master and auto-reconnects on failover — no app code needed for
  # this, see Shared/Infrastructure/RedisClickCounterService.cs and Shared/Common/EntityCacheService.cs).
  redis-master:
    logging: *default-logging
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/master-entrypoint.sh:/master-entrypoint.sh:ro
      # Just this one small marker file (master-entrypoint.sh's STATE_FILE) - not RDB/AOF data, this
      # stack doesn't persist Redis's actual dataset across recreates. Needs to survive a container
      # recreate specifically so a restart that can't reach any Sentinel can tell "I was last a
      # confirmed replica" from "I've never been told anything" - see master-entrypoint.sh's header.
      - redis-master-state:/state
    # Checks with Sentinel before deciding to start as a master - see master-entrypoint.sh for why a
    # bare `redis-server` here would produce a split brain on rejoin after a real failover.
    entrypoint: ["/bin/sh", "/master-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-replica1:
    logging: *default-logging
    image: redis:7-alpine
    # --min-replicas-* baked in here too, not just master-entrypoint.sh's redis-master paths -
    # Sentinel promotes a replica to master via REPLICAOF NO ONE without setting server-level config,
    # so whichever node ends up master (this one included) needs to have started with it already.
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "10"]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-replica2:
    logging: *default-logging
    image: redis:7-alpine
    # See redis-replica1's comment on --min-replicas-*.
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--min-replicas-to-write", "1", "--min-replicas-max-lag", "10"]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-1:
    logging: *default-logging
    image: redis:7-alpine
    # Sentinel rewrites its own config file on every state change, so the template gets copied into
    # a writable named volume rather than bind-mounted read-only from the repo.
    entrypoint: ["/bin/sh", "-c"]
    # Without `sentinel resolve-hostnames` (see infra/redis/sentinel.conf for why), a hostname in
    # the "sentinel monitor" line still has to resolve once at Sentinel's own startup to seed the
    # initial IP - but verified live that Sentinel's own internal resolver fails on this hostname
    # even when `getent`/`redis-cli -h` (this same image, same network) resolve it fine, treating
    # the failure as FATAL (crash-loops, no retry) rather than transient - looks like a musl/Alpine
    # resolver quirk in the Sentinel binary itself, not an actual DNS problem. Worked around by
    # resolving the IP ourselves with `getent` (known-working) and baking the literal IP into the
    # generated config, so Sentinel's own resolver is never involved at all.
    # The config is only regenerated from the template if the existing one (in the named volume) has
    # never been rewritten by Sentinel itself - detected via the "# Generated by CONFIG REWRITE"
    # header Sentinel prepends every time it rewrites its own config (on every state change: a
    # failover, a newly-discovered replica, ...). A literal IP baked in on one `docker compose up`
    # goes stale the moment redis-master's container gets recreated, because Docker hands out
    # container IPs from the network's pool in creation order, not by hostname - a later `up`/`down`
    # cycle can easily reassign that same IP to a different container (verified live: a stale
    # sentinel.conf here ended up pointing "mymaster" at what had become redis-replica1's IP, and
    # StackExchange.Redis's Sentinel client rejected it once it saw `role:slave` in INFO, throwing
    # "Failed connecting to configured primary" on every request) - so a pristine, never-rewritten
    # config still needs a fresh re-resolve on every start. But unconditionally regenerating on every
    # start (an earlier version of this fix) has the opposite failure mode: it discards a REAL
    # failover Sentinel already learned about (mymaster correctly pointing at the promoted replica)
    # the moment this container next restarts, resetting "mymaster" back to whatever "redis-master"
    # currently resolves to - which may by then be a demoted replica or a stale independent master,
    # not the real one. Checking for the CONFIG REWRITE marker distinguishes "this file still has
    # the pristine template's guess" (safe, even necessary, to re-resolve) from "Sentinel has actually
    # learned something since" (must be preserved, not overwritten). The sed is anchored to the
    # `sentinel monitor` line specifically (not a bare `s/redis-master/`) so it substitutes the IP
    # into the directive without also mangling this comment's own prose.
    command: ["if [ -f /etc/redis/sentinel.conf ] && grep -q '# Generated by CONFIG REWRITE' /etc/redis/sentinel.conf; then echo 'sentinel.conf already has Sentinel-learned state - keeping it as-is'; else until getent hosts redis-master >/dev/null 2>&1; do echo 'waiting for redis-master DNS...'; sleep 1; done; MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}' | head -1); sed \"s/^sentinel monitor mymaster redis-master/sentinel monitor mymaster $$MASTER_IP/\" /etc/redis-template/sentinel.conf > /etc/redis/sentinel.conf; fi; exec redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis-template/sentinel.conf:ro
      - redis-sentinel-1-data:/etc/redis
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_healthy
      redis-replica2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-2:
    logging: *default-logging
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    # See the matching comment on redis-sentinel-1 for why this resolves "redis-master" itself
    # (Sentinel's own internal resolver faults on it) and why the config is only regenerated from the
    # template when the existing one has never been rewritten by Sentinel itself (detected via the
    # "# Generated by CONFIG REWRITE" marker) - not unconditionally on every start, which would
    # discard a real, already-learned failover the next time this container restarts.
    command: ["if [ -f /etc/redis/sentinel.conf ] && grep -q '# Generated by CONFIG REWRITE' /etc/redis/sentinel.conf; then echo 'sentinel.conf already has Sentinel-learned state - keeping it as-is'; else until getent hosts redis-master >/dev/null 2>&1; do echo 'waiting for redis-master DNS...'; sleep 1; done; MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}' | head -1); sed \"s/^sentinel monitor mymaster redis-master/sentinel monitor mymaster $$MASTER_IP/\" /etc/redis-template/sentinel.conf > /etc/redis/sentinel.conf; fi; exec redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis-template/sentinel.conf:ro
      - redis-sentinel-2-data:/etc/redis
    ports:
      - "26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_healthy
      redis-replica2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-3:
    logging: *default-logging
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    # See the matching comment on redis-sentinel-1 for why this resolves "redis-master" itself
    # (Sentinel's own internal resolver faults on it) and why the config is only regenerated from the
    # template when the existing one has never been rewritten by Sentinel itself (detected via the
    # "# Generated by CONFIG REWRITE" marker) - not unconditionally on every start, which would
    # discard a real, already-learned failover the next time this container restarts.
    command: ["if [ -f /etc/redis/sentinel.conf ] && grep -q '# Generated by CONFIG REWRITE' /etc/redis/sentinel.conf; then echo 'sentinel.conf already has Sentinel-learned state - keeping it as-is'; else until getent hosts redis-master >/dev/null 2>&1; do echo 'waiting for redis-master DNS...'; sleep 1; done; MASTER_IP=$$(getent hosts redis-master | awk '{print $$1}' | head -1); sed \"s/^sentinel monitor mymaster redis-master/sentinel monitor mymaster $$MASTER_IP/\" /etc/redis-template/sentinel.conf > /etc/redis/sentinel.conf; fi; exec redis-sentinel /etc/redis/sentinel.conf"]
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis-template/sentinel.conf:ro
      - redis-sentinel-3-data:/etc/redis
    ports:
      - "26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_healthy
      redis-replica2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
      - "15692:15692" # Prometheus metrics (rabbitmq_prometheus plugin, enabled below) - scraped by prometheus (observability profile) at infra/prometheus/prometheus.yml's rabbitmq job
    volumes:
      # rabbitmq_prometheus is actually already on by default in the rabbitmq:3-management-alpine
      # tag this service uses (confirmed live via `rabbitmq-plugins list -e` against the running
      # container) - this mount is functionally redundant today. Kept anyway and pinned explicitly
      # rather than relied on implicitly, so a future image/tag bump that changes what ships enabled
      # by default can't silently turn this plugin (and the rabbitmq scrape job in
      # infra/prometheus/prometheus.yml that depends on it) off with no error anywhere. Not
      # profile-gated (unlike the postgres/redis/mongo exporters below): it's a one-line tweak to
      # this already-always-on service, and the extra listener is free when nothing's scraping it in
      # Aspire mode.
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      # "ping" only checks the Erlang node is alive — it can succeed before the AMQP listener
      # itself is actually bound, which raced clients that connect the moment it goes "healthy".
      # check_port_connectivity verifies the configured ports (5672 included) are open.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3-node replica set (mongo1/2/3), no auth (keyless replset — matches the rest of this stack's
  # no-auth dev posture). mongo-init below runs rs.initiate() once; the members themselves just
  # need --replSet so they know what set they belong to.
  mongo1:
    logging: *default-logging
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017" # exposed for local inspection (mongosh / Compass), same spirit as postgres's 5432
    volumes:
      - mongo1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo2:
    logging: *default-logging
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo3:
    logging: *default-logging
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: initiates rs0 once all 3 members are up, then exits 0. Idempotent across restarts —
  # rs.status() succeeds (and it just logs "already initialized") once the set exists, so a
  # `docker compose up` that recreates this container harmlessly no-ops instead of erroring.
  mongo-init:
    logging: *default-logging
    image: mongo:7
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mongosh --host mongo1:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initialized");
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "mongo1:27017" },
                { _id: 1, host: "mongo2:27017" },
                { _id: 2, host: "mongo3:27017" }
              ]
            });
            print("replica set initiated");
          }
        '
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy

  mongo-express:
    logging: *default-logging
    image: mongo-express:latest
    ports:
      - "8085:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
      # Dev-only, same spirit as the aspire-dashboard anonymous-access flag below - skips the
      # basic-auth prompt so this behaves like RedisInsight (open the URL, no login).
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  redisinsight:
    logging: *default-logging
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    # No database is pre-registered — on first open, add one with host "redis-master", port 6379
    # (RedisInsight itself isn't Sentinel-aware; it's a dev GUI, not the app, so pointing it at the
    # current master directly is fine — re-add if a failover actually promotes a different node).

  pgweb:
    logging: *default-logging
    image: sosedoff/pgweb:latest
    ports:
      - "8084:8081"
    environment:
      # Connects straight to the primary (not pgcat) and opens on links_db by default - switch
      # databases (users_db/clicks_db) from pgweb's own connection screen if needed.
      PGWEB_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/links_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # Browses the sqlite fallback stores that link-api/redirect-api write to when RabbitMq is
  # unreachable (see SqliteMessageFallbackStore) - one viewer per service since each keeps its own
  # file, not a shared database. Read-only on both sides: `-x` is only "don't auto-launch a
  # browser", not a read-only flag (that's `-r`/`--read-only`) - without it, sqlite-web is a full
  # CRUD admin UI (edit/insert/delete rows, run arbitrary SQL) on the exact file
  # SqliteMessageFallbackStore/RabbitMqRetryWorker are concurrently reading/writing, and a row
  # deleted through the viewer is a fallback message permanently lost - it can never be republished
  # once removed, defeating the entire point of the outage-recovery feature this is meant to let you
  # observe. The `:ro` volume mount is a second, filesystem-level backstop in case `-r` is ever
  # dropped or the image's flag behavior changes.
  link-api-fallback-viewer:
    logging: *default-logging
    image: coleifer/sqlite-web:latest
    command: ["sqlite_web", "-H", "0.0.0.0", "-x", "-r", "/data/rabbitmq-fallback.db"]
    ports:
      - "8086:8080"
    volumes:
      - link-api-data:/data:ro
    depends_on:
      - link-api

  redirect-api-fallback-viewer:
    logging: *default-logging
    image: coleifer/sqlite-web:latest
    command: ["sqlite_web", "-H", "0.0.0.0", "-x", "-r", "/data/rabbitmq-fallback.db"]
    ports:
      - "8087:8080"
    volumes:
      - redirect-api-data:/data:ro
    depends_on:
      - redirect-api

  aspire-dashboard:
    logging: *default-logging
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888" # dashboard UI
      - "18889:18889" # OTLP gRPC endpoint — otel-collector forwards logs/metrics/traces here
    environment:
      # Dev-only: disables the dashboard's own login and OTLP API-key check. Never do this outside
      # a local learning setup.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  # Every service's OTEL_EXPORTER_OTLP_ENDPOINT points here now, not straight at aspire-dashboard.
  # Which config file it loads is picked by OTEL_COLLECTOR_CONFIG (same override pattern as
  # DB_HOST/CACHE_ENABLED elsewhere in this file) - unset/default fans out to aspire-dashboard +
  # control-api same as always; start-stack.ps1's -Observability Full sets it to
  # otel-collector-config.full.yaml, which instead fans to prometheus/jaeger/loki + control-api.
  # See both files' own headers for why they're mutually exclusive rather than always-all-of-it.
  otel-collector:
    logging: *default-logging
    image: otel/opentelemetry-collector:latest
    volumes:
      - ./infra/otel-collector/${OTEL_COLLECTOR_CONFIG:-otel-collector-config.yaml}:/etc/otelcol/config.yaml:ro
    ports:
      - "8889:8889" # Prometheus scrape endpoint (only served/scraped in the Full variant; harmless to publish otherwise)
    depends_on:
      aspire-dashboard:
        condition: service_started

  # The four services below only start with `docker compose --profile observability up` (what
  # start-stack.ps1's -Observability Full does) - a plain `docker compose up` never touches them,
  # so the default/everyday stack is unchanged. See otel-collector-config.full.yaml for how they're
  # fed and its header for why aspire-dashboard is deliberately left out of that fan-out.
  prometheus:
    logging: *default-logging
    profiles: ["observability"]
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  jaeger:
    logging: *default-logging
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    environment:
      # Default in-memory store is unbounded (0 = no cap) - the same "in-memory store with no
      # eviction" problem this whole feature exists to route around for aspire-dashboard, just
      # lower exposure since the intended usage is one run then `stop-stack.ps1` (which discards the
      # container entirely). Capped anyway so a long-lived Full session can't grow without bound.
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686" # UI - trace ingestion (OTLP gRPC on 4317) only happens over the internal network, from otel-collector

  loki:
    logging: *default-logging
    profiles: ["observability"]
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro

  grafana:
    logging: *default-logging
    profiles: ["observability"]
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      # Dev-only: skips Grafana's own login, same posture as aspire-dashboard's
      # DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS and mongo-express's ME_CONFIG_BASICAUTH above.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # Grafana's own sqlite DB (org/user state, and anything not covered by the provisioned
      # dashboards/datasources above, e.g. UI-driven edits) - without this, every container
      # recreate started from a blank slate. The 3 dashboards themselves don't depend on this for
      # persistence (they're loaded from the provisioning mount above on every start regardless);
      # this is for state beyond what's checked into those files.
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki

  # One exporter per node (not one per cluster) across all three HA clusters - deliberately, since
  # what this stack is actually meant to demonstrate is replication lag, who's currently
  # primary/master, and what a degraded node looks like (pgcat/Sentinel/the replica set all exist
  # for that story - see resilience docs). A single exporter per cluster would only ever show one
  # node and hide exactly the thing worth graphing. No host ports published - Prometheus reaches
  # these over the internal network only, same as otel-collector before this.
  postgres-exporter-primary:
    logging: *default-logging
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter-replica1:
    logging: *default-logging
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-replica1:5432/postgres?sslmode=disable"
    depends_on:
      postgres-replica1:
        condition: service_healthy

  postgres-exporter-replica2:
    logging: *default-logging
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-replica2:5432/postgres?sslmode=disable"
    depends_on:
      postgres-replica2:
        condition: service_healthy

  redis-exporter-master:
    logging: *default-logging
    profiles: ["observability"]
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis-master:6379"
    depends_on:
      redis-master:
        condition: service_healthy

  redis-exporter-replica1:
    logging: *default-logging
    profiles: ["observability"]
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis-replica1:6379"
    depends_on:
      redis-replica1:
        condition: service_healthy

  redis-exporter-replica2:
    logging: *default-logging
    profiles: ["observability"]
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis-replica2:6379"
    depends_on:
      redis-replica2:
        condition: service_healthy

  mongo-exporter-1:
    logging: *default-logging
    profiles: ["observability"]
    # Pinned, unlike this file's other :latest exporters - percona/mongodb_exporter doesn't publish
    # a `latest` tag at all (confirmed live: pulling it 404s), only versioned ones.
    image: percona/mongodb_exporter:0.53
    environment:
      # directConnection=true is explicit here, not just relied on implicitly via "single host + no
      # replicaSet param" (which happens to default to a direct connection per the MongoDB URI spec,
      # confirmed live that it does) - without it, a plausible future edit adding `?replicaSet=rs0`
      # (the set is literally named that elsewhere in this file) would silently make the driver
      # discover the real primary and route all 3 exporters there instead of each scraping its own
      # member, collapsing the entire point of running one per member with no error anywhere.
      MONGODB_URI: "mongodb://mongo1:27017/?directConnection=true"
    # diagnosticdata/replicasetstatus need the replica set actually initiated (mongo-init below) -
    # without them the exporter only exposes generic process-level metrics, missing the replication
    # lag / member-state data that's the whole point of running one of these per member.
    command: ["--collector.diagnosticdata", "--collector.replicasetstatus"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  mongo-exporter-2:
    logging: *default-logging
    profiles: ["observability"]
    image: percona/mongodb_exporter:0.53
    environment:
      MONGODB_URI: "mongodb://mongo2:27017/?directConnection=true"
    command: ["--collector.diagnosticdata", "--collector.replicasetstatus"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  mongo-exporter-3:
    logging: *default-logging
    profiles: ["observability"]
    image: percona/mongodb_exporter:0.53
    environment:
      MONGODB_URI: "mongodb://mongo3:27017/?directConnection=true"
    command: ["--collector.diagnosticdata", "--collector.replicasetstatus"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  auth-api:
    logging: *default-logging
    build:
      context: ..
      dockerfile: src/backend/Services/AuthApi/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # DB_HOST/DB_PORT default to pgcat - control-api's pgcat toggle re-runs `docker compose up`
      # with these overridden to postgres:5432, recreating this service so it demonstrates running
      # without connection pooling instead of just leaving pgcat unused. Maximum Pool Size (Npgsql's
      # own client-side pool, distinct from pgcat's server-side pool) is 100 by default - the
      # experimental control lets it be shrunk to demonstrate Npgsql's own pool-wait saturation
      # independent of pgcat's, see SetNpgsqlPoolSizeAsync.
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=users_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # EF migrations (DDL) go straight to the primary, bypassing PgCat entirely - see
      # Constants.PostgresPrimaryConnectionString for why.
      ConnectionStrings__PostgresPrimary: "Host=postgres;Port=5432;Database=users_db;Username=postgres;Password=postgres"
      Jwt__SigningKey: *jwt-signing-key
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Default OTel batch span processor flush delay is 5000ms - longer than some traffic
      # runs (as short as 1s) even last, which left the bottleneck advisor systematically
      # missing trace data for short/recent runs. Standard OTEL_BSP_* env var, read directly
      # by the .NET SDK's BatchExportActivityProcessorOptions - no code change needed.
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    depends_on:
      pgcat:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # /health/ready (not /health/live, which runs zero checks and is Healthy the instant the
    # process starts listening) - service_healthy is what nginx's own depends_on gates on for
    # link-api/redirect-api below, so it needs to mean "can actually reach Postgres/RabbitMQ", not
    # just "the process is up". Same reasoning on every other service's healthcheck in this file.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  link-api:
    logging: *default-logging
    build:
      context: ..
      dockerfile: src/backend/Services/LinkApi/Dockerfile
    # No host port mapping - multiple replicas (docker compose up --scale link-api=N) can't all
    # bind the same host port. nginx is the external entry point on 8082 instead (see below).
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=links_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # Sentinel-aware form (StackExchange.Redis native support): endpoints are the 3 Sentinels, not
      # the master directly - the client asks them who's master, connects there, and gets told about
      # any failover automatically. No code change needed for this vs. a plain host:port string.
      ConnectionStrings__Redis: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379,serviceName=mymaster"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # Points the fallback store's sqlite file at the volume below (instead of appsettings.json's
      # default, which lands inside the container's ephemeral filesystem) so link-api-fallback-viewer
      # can read the same file.
      ConnectionStrings__RabbitMqFallback: "Data Source=/data/rabbitmq-fallback.db"
      Jwt__SigningKey: *jwt-signing-key
      Internal__ApiKey: *internal-api-key
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Default OTel batch span processor flush delay is 5000ms - longer than some traffic
      # runs (as short as 1s) even last, which left the bottleneck advisor systematically
      # missing trace data for short/recent runs. Standard OTEL_BSP_* env var, read directly
      # by the .NET SDK's BatchExportActivityProcessorOptions - no code change needed.
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      # Defaults to true - control-api's cache toggle recreates link-api/redirect-api with this set
      # to false so the app skips Redis entirely (see EntityCacheService), a clean "no caching"
      # demo rather than every request eating a failed-connection timeout against a stopped redis.
      Cache__Enabled: "${CACHE_ENABLED:-true}"
    volumes:
      - link-api-data:/data
    # LinkApi.csproj turns on Server GC, which sizes one heap per logical core it detects - with no
    # limit here it detects the whole host, so scaling this service to N replicas (control-api's
    # ScalableServices) multiplies reserved GC heap memory by N against the host's full core count,
    # not against what each replica is actually meant to get. .NET reads a container's cgroup
    # cpus/memory quota (not just the host's) to size Server GC since .NET Core 3.0+, so this limit
    # is what makes that sizing reflect one replica's real share instead of the whole host. Raised
    # from 1.0 to 1.5 after a 200-VU/20-replica run showed real cgroup CFS throttling (cpu.stat's
    # nr_throttled/throttled_usec, confirmed non-zero) once the pgcat bottleneck below it was fixed -
    # 1.0 core left no slack for the healthcheck's own curl process alongside real traffic on the
    # same quota. See sandbox/docs/pgcat-pool-sizing.md.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    depends_on:
      pgcat:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  redirect-api:
    logging: *default-logging
    build:
      context: ..
      dockerfile: src/backend/Services/RedirectApi/Dockerfile
    # No host port mapping - see the note on link-api above; nginx exposes this on 8083 instead.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=links_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      ConnectionStrings__Redis: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379,serviceName=mymaster"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # See link-api's identical override - same reasoning, read by redirect-api-fallback-viewer.
      ConnectionStrings__RabbitMqFallback: "Data Source=/data/rabbitmq-fallback.db"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Default OTel batch span processor flush delay is 5000ms - longer than some traffic
      # runs (as short as 1s) even last, which left the bottleneck advisor systematically
      # missing trace data for short/recent runs. Standard OTEL_BSP_* env var, read directly
      # by the .NET SDK's BatchExportActivityProcessorOptions - no code change needed.
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      Cache__Enabled: "${CACHE_ENABLED:-true}"
    volumes:
      - redirect-api-data:/data
    # See link-api's identical limit above - same reasoning, same Server GC setting in
    # RedirectApi.csproj, same ScalableServices membership.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
    depends_on:
      pgcat:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    logging: *default-logging
    image: nginx:alpine
    ports:
      - "8082:8082" # LinkApi - round-robins across however many link-api replicas exist
      - "8083:8083" # RedirectApi - same, for redirect-api
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      link-api:
        condition: service_healthy
      redirect-api:
        condition: service_healthy

  shortener-service:
    logging: *default-logging
    build:
      context: ..
      dockerfile: src/backend/Services/ShortenerService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=links_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # EF migrations (DDL) go straight to the primary, bypassing PgCat entirely - see
      # Constants.PostgresPrimaryConnectionString for why.
      ConnectionStrings__PostgresPrimary: "Host=postgres;Port=5432;Database=links_db;Username=postgres;Password=postgres"
      # Pre-warms LinkCacheService right after a link is actually persisted (see
      # LinkCreatedConsumer) so RedirectApi's own cache miss doesn't also race a Postgres read that
      # hasn't caught up yet - same Sentinel-aware connection string as redirect-api's.
      ConnectionStrings__Redis: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379,serviceName=mymaster"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # Consumer QoS (unacked deliveries in flight) - read once at consumer startup, so changing it
      # needs a recreate, not a live toggle. See RabbitMqConsumer's own _prefetchCount field.
      RabbitMq__PrefetchCount: "${RABBITMQ_PREFETCH:-10}"
      # How many deliveries RabbitMqConsumer buffers before flushing one bulk DB write, and how long
      # a partial batch waits before flushing anyway - see its _batchSize/_batchTimeout fields.
      RabbitMq__BatchSize: "${RABBITMQ_BATCH_SIZE:-100}"
      RabbitMq__BatchTimeoutMs: "${RABBITMQ_BATCH_TIMEOUT_MS:-500}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Default OTel batch span processor flush delay is 5000ms - longer than some traffic
      # runs (as short as 1s) even last, which left the bottleneck advisor systematically
      # missing trace data for short/recent runs. Standard OTEL_BSP_* env var, read directly
      # by the .NET SDK's BatchExportActivityProcessorOptions - no code change needed.
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    depends_on:
      pgcat:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  traffic-service:
    logging: *default-logging
    build:
      context: ..
      dockerfile: src/backend/Services/TrafficService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=${DB_HOST:-pgcat};Port=${DB_PORT:-6432};Database=clicks_db;Username=postgres;Password=postgres;Maximum Pool Size=${NPGSQL_MAX_POOL_SIZE:-100}"
      # EF migrations (DDL) go straight to the primary, bypassing PgCat entirely - see
      # Constants.PostgresPrimaryConnectionString for why.
      ConnectionStrings__PostgresPrimary: "Host=postgres;Port=5432;Database=clicks_db;Username=postgres;Password=postgres"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # Replica-set-aware URI - the Mongo driver discovers the current primary from these 3 seeds
      # and auto-reconnects on failover; MongoClickMetaStore already just takes whatever connection
      # string it's given (database name comes from the URL path), no code change needed.
      # readPreference is the only part of this driven by the experimental control - see
      # SetMongoReadPreferenceAsync. MongoClickMetaStore itself needs no code change; it already
      # just takes whatever connection string it's given.
      ConnectionStrings__Mongo: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/clicks_meta_db?replicaSet=rs0&readPreference=${MONGO_READ_PREFERENCE:-primary}"
      RabbitMq__PrefetchCount: "${RABBITMQ_PREFETCH:-10}"
      RabbitMq__BatchSize: "${RABBITMQ_BATCH_SIZE:-100}"
      RabbitMq__BatchTimeoutMs: "${RABBITMQ_BATCH_TIMEOUT_MS:-500}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Default OTel batch span processor flush delay is 5000ms - longer than some traffic
      # runs (as short as 1s) even last, which left the bottleneck advisor systematically
      # missing trace data for short/recent runs. Standard OTEL_BSP_* env var, read directly
      # by the .NET SDK's BatchExportActivityProcessorOptions - no code change needed.
      OTEL_BSP_SCHEDULE_DELAY: "1000"
    depends_on:
      pgcat:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-api:
    logging: *default-logging
    build:
      context: ./infra/control-api
      dockerfile: Dockerfile
    ports:
      # Bound to loopback, not all interfaces: this holds the host's Docker socket (root-equivalent
      # control over every container in this compose project) with no authentication on top of it -
      # fine for "the person at this keyboard", not fine for "anyone who can reach this host's IP".
      # Binding to 127.0.0.1 stops another machine on the LAN from ever reaching it; it does not stop
      # another process on this same host - this is still a local-dev-only tool, not a hardened one.
      - "127.0.0.1:5299:8080"
    environment:
      Docker__Endpoint: "unix:///var/run/docker.sock"
      Docker__ComposeProject: "sandbox"
      Docker__ComposeFile: "/workspace/sandbox/docker-compose.yml"
      Architecture__File: "/workspace/sandbox/frontend/architecture-map/src/data/architecture.json"
      Pgcat__ConfigDir: "/pgcat-config"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5174"
      Scenarios__DataDir: "/data"
      # Sent as the X-Internal-Api-Key header to LinkApi's GET /Links when preloading a traffic
      # data-pool - see InternalApiKeyAuthenticationHandler for why a per-user JWT can't do this.
      Internal__ApiKey: *internal-api-key
    volumes:
      # Lets this container talk to the Docker Engine managing the whole stack, so it can
      # stop/start/restart sibling containers on request. Local-stack-only tool - never point this
      # at a shared/real host; see sandbox/docs/architecture.md for why this is safe here.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: needed so the `docker compose` CLI inside this container (see its Dockerfile)
      # can find docker-compose.yml to run `--scale`. Compose itself does the actual work against
      # the Docker Engine via the socket above; this mount is just so it can read its own file.
      # Mounts the repo root (not just sandbox/) so that if compose ever decides a build is needed
      # (image missing locally) rather than reusing an already-built one, the build `context: ..`
      # link-api/redirect-api/etc. declare - resolved relative to the mounted docker-compose.yml,
      # i.e. relative to /workspace/sandbox - actually exists in this container's filesystem too.
      - ../:/workspace:ro
      # Separate, writable mount of the same host directory the pgcat service reads its config from
      # (read-only, below) - lets control-api rewrite pgcat.toml directly for the pool-settings
      # control without touching the read-only /workspace mount above. pgcat's own `autoreload`
      # picks up the change on its own; see DockerService.SetPgcatPoolSettingsAsync.
      - ./infra/pgcat:/pgcat-config
      # Saved custom traffic scenarios (endpoints + load ramp) - a real volume, not the read-only
      # workspace mount above, so they survive a control-api rebuild the same way postgres-data
      # survives one.
      - control-api-data:/data

volumes:
  postgres-data:
  postgres-replica1-data:
  postgres-replica2-data:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
  redis-master-state:
  redisinsight-data:
  grafana-data:
  control-api-data:
  link-api-data:
  redirect-api-data:
