# Shared dev-only JWT signing key — AuthApi issues tokens with it, LinkApi validates them with the
# same key. A single anchor means the two can't accidentally drift onto different values.
x-jwt-signing-key: &jwt-signing-key "dev-only-signing-key-do-not-use-in-production-1234567890"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkshortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      # "ping" only checks the Erlang node is alive — it can succeed before the AMQP listener
      # itself is actually bound, which raced clients that connect the moment it goes "healthy".
      # check_port_connectivity verifies the configured ports (5672 included) are open.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    # No database is pre-registered — on first open, add one with host "redis", port 6379.

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888" # dashboard UI
      - "18889:18889" # OTLP gRPC endpoint — services send logs/metrics/traces here
    environment:
      # Dev-only: disables the dashboard's own login and OTLP API-key check. Never do this outside
      # a local learning setup.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  auth-api:
    build:
      context: .
      dockerfile: src/Services/AuthApi/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=linkshortener;Username=postgres;Password=postgres"
      Jwt__SigningKey: *jwt-signing-key
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

  link-api:
    build:
      context: .
      dockerfile: src/Services/LinkApi/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=linkshortener;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      Jwt__SigningKey: *jwt-signing-key
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

  redirect-api:
    build:
      context: .
      dockerfile: src/Services/RedirectApi/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=linkshortener;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

  shortener-service:
    build:
      context: .
      dockerfile: src/Services/ShortenerService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=linkshortener;Username=postgres;Password=postgres"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

  traffic-service:
    build:
      context: .
      dockerfile: src/Services/TrafficService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=linkshortener;Username=postgres;Password=postgres"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

volumes:
  postgres-data:
  redisinsight-data:
